name: Deploy

# main is published at the site root, every other branch at preview/<branch>/ on the gh-pages branch.
# Only pushes to this repo run it (never pull requests from forks), so only people with write
# access can create previews.
on:
  push:
    branches-ignore: [gh-pages]
  delete:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.event_name != 'delete' && github.repository == 'gdkrmr/logitlens'
    runs-on: ubuntu-latest
    # a newer push to the same branch replaces a running build
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # the wasm only changes with the wllama fork commit, so key the cache on it
      - name: Get wllama commit
        id: wllama
        run: echo "sha=$(git -C third_party/wllama rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore wasm build
        id: wasm-cache
        uses: actions/cache@v6
        with:
          path: |
            third_party/wllama/src/wasm/wllama.wasm
            third_party/wllama/src/wasm/wllama.js
            third_party/wllama/src/wasm/source-map.ts
          key: wllama-wasm-${{ steps.wllama.outputs.sha }}

      # Docker emsdk build, 10-20 min; only runs when the fork commit changes
      - name: Build wasm
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        working-directory: third_party/wllama
        run: |
          SKIP_COMPAT=1 ./scripts/build_wasm.sh
          test -f src/wasm/wllama.wasm

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # embeds the (possibly rebuilt) emscripten JS into the worker code
      - name: Generate worker code
        working-directory: third_party/wllama
        run: ./scripts/build_worker.sh

      - name: Build site
        working-directory: web
        env:
          # shown as a badge on preview builds
          VITE_BRANCH: ${{ github.ref_name != 'main' && github.ref_name || '' }}
        run: |
          npm ci
          npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: web/dist
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    # one writer at a time on gh-pages; queued, never cancelled, so no update is lost
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: site

      - name: Publish to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          slug=$(echo "$REF" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g')
          repo="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$repo" gh-pages > /dev/null; then
            git clone --quiet --depth 1 --branch gh-pages "$repo" pages
          else
            git init --quiet -b gh-pages pages
            git -C pages remote add origin "$repo"
          fi
          cd pages
          if [ "$REF" = main ]; then
            # replace everything at the root except the previews
            find . -mindepth 1 -maxdepth 1 ! -name .git ! -name preview -exec rm -rf {} +
            cp -r ../site/. .
            echo logitlens.gdkrmr.com > CNAME
            printf 'User-agent: *\nDisallow: /preview/\n' > robots.txt
            dest="/"
          else
            rm -rf "preview/$slug"
            mkdir -p "preview/$slug"
            cp -r ../site/. "preview/$slug/"
            dest="/preview/$slug/"
          fi
          # files starting with _ (e.g. _headers) would be dropped by Jekyll
          touch .nojekyll
          git add -A
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "Publish $REF at $dest (${GITHUB_SHA::7})"
          git push --quiet origin gh-pages
          echo "Published https://logitlens.gdkrmr.com$dest" >> "$GITHUB_STEP_SUMMARY"

  # remove a branch's preview when the branch is deleted
  cleanup:
    if: github.event_name == 'delete' && github.event.ref_type == 'branch' && github.repository == 'gdkrmr/logitlens'
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - name: Remove preview
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.event.ref }}
        run: |
          set -euo pipefail
          slug=$(echo "$REF" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g')
          repo="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git ls-remote --exit-code --heads "$repo" gh-pages > /dev/null || exit 0
          git clone --quiet --depth 1 --branch gh-pages "$repo" pages
          cd pages
          [ -d "preview/$slug" ] || { echo "no preview for $REF"; exit 0; }
          git rm -r --quiet "preview/$slug"
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "Remove preview of deleted branch $REF"
          git push --quiet origin gh-pages
